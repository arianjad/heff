[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heff"
version = "0.1.0"
description = "Effective Hamiltonians for molecules, term-matrix first"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.11", "sympy>=1.12"]

[project.optional-dependencies]
test = ["pytest>=7"]
plot = ["matplotlib>=3.7"]
notebooks = ["matplotlib>=3.7", "jupyterlab>=4", "nbformat>=5", "nbclient>=0.8", "nbconvert>=7", "ipykernel>=6"]

[tool.setuptools]
packages = ["heff", "heff.backends"]

[tool.setuptools.package-data]
heff = ["models/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
