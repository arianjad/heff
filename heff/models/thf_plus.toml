E_eff = { value = 35.0, unit = "GV/cm", uncertainty = 2.45, source = "Ng thesis Eq. C.8 discussion p.322 (JILA adopts ~35); Skripnikov & Titov 2015 give 37.3(7 %), Denis 2015 35.2", status = "ab-initio", note = "OPEN-14: 35.2 vs 37.3 GV/cm. Uncertainty is the quoted +-7 % of the adopted value (2.45 GV/cm), not a spread over the three calculations" }
G_par = { value = 0.04756, unit = "", source = "Ng thesis p.87 (0.048(2) for g_F < 0); reproduces |g_F=3/2| = 0.0149 exactly -- [HAM] S3", status = "estimate", isotopologue = "229Th19F+", note = "Transferred unchanged from 232Th19F+ to 229Th19F+; not measured for the target isotope and not mass-scaled. Source-isotope uncertainty: 0.002 ; target-isotope transfer uncertainty is unquantified. sign of g_F is NOT measured; theory forces g_F < 0. OPEN-4" }
W_TP = { value = 50.0, unit = "kHz", uncertainty = 3.5, source = "Skripnikov & Titov 2015 Table II p.8 (+-7 %)", status = "ab-initio", note = "uncertainty is that quoted +-7 % of 50 kHz" }
c_I = { value = 20.0, unit = "kHz", source = "[HAM] S2.6: B&C Table 8.12 c2(19F, CsF) = 15.1 kHz at B_v = 0.183782 cm-1, scaled linearly in B", status = "estimate", note = "Order-of-magnitude analogy only. The 15.1 kHz CsF anchor gives 19.94 kHz after B scaling; neither the ThF+ sign nor a factor-of-three error bound is established. CsF is closed-shell; ThF+ is open-shell. B&C printed p.421/PDF p.453 discusses opposite-sign first/second-order contributions. Sweep this parameter rather than treating 20 kHz as a precision prediction" }
c_I_Th = { value = 0.0, unit = "kHz", source = "No value anywhere -- gap G3", status = "held-fixed", note = "[TH] S4.6 declines to pick one and brackets it at ~1 kHz to ~1 MHz: g_N(Th)/g_N(F) = 0.0279 pushes down, the 2700x larger electronic hyperfine factor on Th pushes up. OPEN-19" }
d_e = { value = 0.0, unit = "", status = "held-fixed", note = "electron EDM in e.cm; 0 turns the PT-odd block off" }
d_mf = { value = 3.37, unit = "D", source = "Ng 2022 Table I p.5", status = "estimate", isotopologue = "229Th19F+", convention = "center_of_mass", note = "Transferred unchanged from 232Th19F+ to 229Th19F+; not measured for the target isotope and not mass-scaled. Source-isotope uncertainty: 0.09 D; target-isotope transfer uncertainty is unquantified. ORIGIN-DEPENDENT for an ion: 2.74 D w.r.t. the Th nucleus (Skripnikov & Titov 2015 Table II) = 3.46 D at c.m." }
eQq0_Th = { value = -2600, unit = "MHz", source = "HfF+ anchor: eQq0(177HfF+) = -2100 MHz (Petrov 2018, CCSD(T)) x Q(229Th)/Q(177Hf) = 3.11/3.365 x R_el in [1, 1.65] => -2 to -3.3 GHz ([TH] S4.3)", status = "placeholder", note = "Sensitivity placeholder only: the electronic EFG transfer factor R_el and former +/-1000 MHz range are not source-calibrated. The signed Petrov-to-B&C normalization is unresolved, including q=0. Do not treat this as a convention-validated ThF+ quadrupole prediction. See docs/superpowers/reports/2026-09-08-thf-quadrupole-estimate-audit.md" }
eQq2_Th = { value = 300, unit = "MHz", source = "Petrov 2018 Eqs. (24)-(25) route with w(ThF+) = G_par + 0.002319 = 0.0499 against w(HfF+) = 0.014 => ~200-400 MHz ([TH] S4.4)", status = "placeholder", note = "Sensitivity placeholder only; the former +/-100 MHz range is not source-calibrated and the signed value is not a validated B&C input. Inherits the UNVERIFIED normalisation bridge of [TH] S4/S9.4 (OPEN-17): the value inherits an unresolved factor sqrt(2) AND a sign between the B&C (9.52) q = +-2 normalisation and Petrov 2018 Eq. (23)" }
g_N = { value = 5.25773, unit = "", source = "19F nuclear g-factor, Petrov et al. arXiv:1704.06631 Eq. 3", status = "held-fixed" }
g_N_Th = { value = 0.1464, unit = "", uncertainty = 0.0024, source = "mu(229Th)/I = 0.366(6)/(5/2) ([TH] S1.2, Porsev 2021 arXiv:2107.14723)", status = "derived", note = "Retains the 2021 input for continuity. Zitzer et al., PRA 111, L050802 (2025), Table I gives mu=0.365(3) mu_N, hence g_N=0.1460(12), consistent with this older value. The 1974 value 0.46(4) still in ENSDF is superseded and must never be used to rescale a published A_par" }
k_TP = { value = 0.0, unit = "", status = "held-fixed", note = "scalar-pseudoscalar coupling, dimensionless; 0 turns it off" }
omega_ef = { value = 5.29, unit = "MHz", source = "Ng 2022 Table I p.5; Ng thesis Table 4.1 p.87", status = "estimate", isotopologue = "229Th19F+", note = "Transferred unchanged from 232Th19F+ to 229Th19F+; not measured for the target isotope and not mass-scaled. Source-isotope uncertainty: 0.05 MHz; target-isotope transfer uncertainty is unquantified. " }

