schema_version = 1
model_id = "thf_plus"
display_name = "ThF+"
default_manifold = "X3Delta1"
default_isotopologue = "232Th19F"

[isotopologues."232Th19F"]

[[isotopologues."232Th19F".spins]]
label = "19F"
I = 0.5
couple_to = "J"

[manifolds.X3Delta1]
backend = "case_c"
terms = [
  "centrifugal", "hyperfine_A_par", "hyperfine_A_par_dJ1",
  "omega_doubling", "pt_odd_edm", "pt_odd_scalar_pseudoscalar",
  "rotation", "spin_rotation_cI", "stark_z", "zeeman_Gpar",
  "zeeman_nuclear",
]

[manifolds.X3Delta1.electronic]
label = "X3Delta1"
Omega = 1.0
S = 1.0
Lambda = 2.0
T0 = 0.0

[manifolds.X3Delta1.basis]
J_min = 1
J_max = 4
M = "blocks"
frame = "rotating"

[manifolds.X3Delta1.parameters]
B0 = { value = 7274.3325, unit = "MHz", uncertainty = 0.01, source = "Ng 2022 SII B p.2 (interval = 29.09733(4) GHz); Ng thesis S4.1.1 p.78", status = "derived", isotopologue = "232Th19F+", note = "Interval/4 approximation, not a refit with D0 and extra hyperfine terms. Propagated measurement uncertainty is 0.010 MHz. With the current B J(J+1)-D[J(J+1)]^2 terms, the rotational interval is 4B-32D, 124.704 kHz below the source interval; a consistent refit is unresolved" }
D0 = { value = 3.897, unit = "kHz", uncertainty = 0.12, source = "Gresh 2016 Table 1, X3Delta1 D'' column (1.30(4)e-7 cm-1)", status = "measured" }
omega_ef = { value = 5.29, unit = "MHz", uncertainty = 0.05, source = "Ng 2022 Table I p.5; Ng thesis Table 4.1 p.87", status = "measured" }
A_par = { value = -20.1, unit = "MHz", uncertainty = 0.1, source = "Ng 2022 Table I p.5", status = "measured", note = "may absorb 2 c_I .. 6 c_I ~ 40-120 kHz of unmodelled nuclear spin-rotation -- [HAM] S2.6, OPEN-6" }
c_I = { value = 20.0, unit = "kHz", source = "[HAM] S2.6: B&C Table 8.12 c2(19F, CsF) = 15.1 kHz at B_v = 0.183782 cm-1, scaled linearly in B", status = "estimate", note = "Order-of-magnitude analogy only. The 15.1 kHz CsF anchor gives 19.94 kHz after B scaling; neither the ThF+ sign nor a factor-of-three error bound is established. CsF is closed-shell; ThF+ is open-shell. B&C printed p.421/PDF p.453 discusses opposite-sign first/second-order contributions. Sweep this parameter rather than treating 20 kHz as a precision prediction" }
d_mf = { value = 3.37, unit = "D", uncertainty = 0.09, source = "Ng 2022 Table I p.5", status = "measured", convention = "center_of_mass", note = "ORIGIN-DEPENDENT for an ion: 2.74 D w.r.t. the Th nucleus (Skripnikov & Titov 2015 Table II) = 3.46 D at c.m." }
G_par = { value = 0.04756, unit = "", uncertainty = 0.002, source = "Ng thesis p.87 (0.048(2) for g_F < 0); reproduces |g_F=3/2| = 0.0149 exactly -- [HAM] S3", status = "derived", note = "sign of g_F is NOT measured; theory forces g_F < 0. OPEN-4" }
g_N = { value = 5.25773, unit = "", source = "19F nuclear g-factor, Petrov et al. arXiv:1704.06631 Eq. 3", status = "held-fixed" }
E_eff = { value = 35.0, unit = "GV/cm", uncertainty = 2.45, source = "Ng thesis Eq. C.8 discussion p.322 (JILA adopts ~35); Skripnikov & Titov 2015 give 37.3(7 %), Denis 2015 35.2", status = "ab-initio", note = "OPEN-14: 35.2 vs 37.3 GV/cm. Uncertainty is the quoted +-7 % of the adopted value (2.45 GV/cm), not a spread over the three calculations" }
W_TP = { value = 50.0, unit = "kHz", uncertainty = 3.5, source = "Skripnikov & Titov 2015 Table II p.8 (+-7 %)", status = "ab-initio", note = "uncertainty is that quoted +-7 % of 50 kHz" }
d_e = { value = 0.0, unit = "", status = "held-fixed", note = "electron EDM in e.cm; 0 turns the PT-odd block off" }
k_TP = { value = 0.0, unit = "", status = "held-fixed", note = "scalar-pseudoscalar coupling, dimensionless; 0 turns it off" }

